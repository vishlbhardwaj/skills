<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doodle — marker-pen objects</title>
<link rel="stylesheet" href="vendor/dialkit.css">
<style>
  :root { --paper: #FBFAF8; --ink: #0A0A0A; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9E7E3; color: var(--ink);
         font: 13px/1.5 ui-monospace, Menlo, monospace; }

  .stage { position: fixed; inset: 0 340px 0 0; display: grid; place-items: center; padding: 40px; }
  .sheet { position: relative; width: min(74vh, 720px); aspect-ratio: 4 / 5;
           background: var(--paper); box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 30px 70px -30px rgba(0,0,0,.35); }
  .sheet svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* The headline is part of the style, not decoration: every reference frame
     is a serif line, centred, with the drawing well below it. */
  .cap { position: absolute; left: 8%; right: 8%; top: 5.5%; text-align: center;
         font-family: "Hoefler Text", "Playfair Display", Didot, Georgia, serif;
         font-size: clamp(16px, 3.6vh, 34px); line-height: 1.18; letter-spacing: .005em;
         color: var(--ink); }

  .bar { position: fixed; left: 0; bottom: 0; right: 340px; display: flex; gap: 8px;
         justify-content: center; padding: 14px; }
  .tab { height: 32px; padding: 0 14px; border: 1px solid #C9C5BE; border-radius: 999px;
         background: #F3F1ED; color: #5A564F; font: inherit; cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .meta { position: fixed; left: 14px; top: 14px; color: #8A867E; font-size: 11px; letter-spacing: .06em; }
</style>

<main class="stage">
  <div class="sheet" id="sheet">
    <svg id="art" viewBox="0 0 800 1000" aria-label="Doodle illustration"></svg>
    <div class="cap" id="cap"></div>
  </div>
</main>
<div class="bar" id="tabs"></div>
<div class="meta" id="meta"></div>

<script src="vendor/dialkit.js"></script>
<script src="src/hand.js"></script>
<script src="src/view.js"></script>
<script src="src/objects.js"></script>
<script>
/*
 * Every number the hand reads is a dial. That is the whole point of this page:
 * the style is not a look baked into the objects, it is a parameter set you can
 * push until it breaks and then back off.
 */
const DEFAULTS = {
  mark: {
    weight:     [15, 1, 48, 0.5],     // measured: ~1.8% of canvas width
    wander:     [0.8, 0, 4, 0.01],   // in stroke-widths, off the true path
    wobble:     [4, 2, 24, 1],        // control points — LOW is drift, high is tremor
    pressure:   [0.52, 0, 1, 0.01],   // measured: ±40% along the length
    pressureFreq: [5, 2, 20, 1],
    overshoot:  [0.7, 0, 4, 0.05],    // in stroke-widths, past the end
    boil:       [0, 0, 1.2, 0.01],    // fast tremble — the fingers, not the arm
  },
  pen: {
    double:       true,               // the biggest single tell in the reference
    doubleOffset: [0.6, 0, 3, 0.05],
    breaks:       [0.3, 0, 0.9, 0.01],
    blobs:        [0.75, 0, 2.5, 0.05],
    specks:       [7, 0, 60, 1],
  },
  tone: {
    hatchAngle:  [45, 0, 180, 1],
    hatchGap:    [9, 2, 40, 0.5],
    toneGap:     [10, 3, 40, 0.5],
    toneDot:     [0.34, 0.1, 0.8, 0.01],
    scribbleGap: [14, 4, 50, 0.5],
  },

  accent: {
    on: true,
    offsetX:   [-5, -40, 40, 0.5],    // misregistration, like a second plate
    offsetY:   [4, -40, 40, 0.5],
    regionRag: [0.5, 0, 4, 0.05],
    colour:    "#0A84F8",
  },
  /*
   * Palette.
   *
   * NOT the measured values. Everything in the reference photograph sits in a
   * 27–51° hue band — even the blue cushion reads hue 49 on its lit face,
   * because golden-hour light has overwhelmed its local colour. That photo
   * works because of LIGHT, which flat marker fills cannot reproduce; copying
   * the samples literally gives a brown smear. These restore each object's
   * identity colour while keeping the reference's warm bias and its sequence
   * around the sofa: orange, amber, blue, olive.
   */
  palette: {
    cOrange: "#E8622A",
    cAmber:  "#F0A526",
    cBlue:   "#7FA3B5",
    cOlive:  "#A8B35E",
    cWood:   "#D39A58",
    cWash:   "#F7E9D4",
    cSofa:   "#F1EBE2",
    cGreen:  "#5E7A55",
    cGreenD: "#44583E",
    cLeaf:   "#7E9B5E",
  },

  sheet: {
    scale:  [1, 0.3, 1.6, 0.01],
    lift:   [6, -30, 40, 1],          // nudge the drawing up or down the page
    ink:    "#0A0A0A",
    paper:  "#FBFAF8",
    seed:   [7, 1, 999, 1],
  },
};

const CAPTIONS = { nook3: "The good chair, in depth.", persp: "One point, one room.", nook: "The good chair.", corner: "A corner to read in.", shop: "Open since Tuesday.", room: "Afternoon, indoors.", lock: "Locked by default.", bottle: "Stay hydrated.", shoe: "Built for the long run." };

const q = new URLSearchParams(location.search);
if (q.has("reset")) { try { for (const k of Object.keys(localStorage)) if (/dial|doodle/i.test(k)) localStorage.removeItem(k); } catch (e) {} }

const art = document.getElementById("art");
const cap = document.getElementById("cap");
const NS = "http://www.w3.org/2000/svg";
let which = q.get("o") && Objects.ALL[q.get("o")] ? q.get("o") : "room";
let V = null;

/*
 * Darken a fill toward the ink. A box projected correctly still reads as a
 * flat slab if every face is the same colour — the convergence alone does not
 * carry it. Value per face is what makes a solid look solid.
 */
function shade(hex, amt) {
  if (amt == null || amt === 1) return hex;
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v * amt)));
  return "#" + [f((n >> 16) & 255), f((n >> 8) & 255), f(n & 255)]
    .map((v) => v.toString(16).padStart(2, "0")).join("");
}

const flat = (o) => {
  const P = {};
  for (const k of Object.keys(o)) {
    const v = o[k];
    if (Array.isArray(v)) P[k] = v[0];
    else if (v && typeof v === "object") Object.assign(P, flat(v));
    else P[k] = v;
  }
  return P;
};

function draw() {
  let P = V || flat(DEFAULTS);
  const W = 800, H = 1000;
  const obj = Objects.ALL[which].build(P);

  /*
   * Fit the DRAWING, not its coordinate box.
   *
   * Scaling by the 0–100 box meant a wide flat object used a fraction of the
   * frame while a square one filled it — so the shoe came out small, its
   * collar notch finer than the stroke drawing it, and the hand swallowed the
   * very landmarks that make it a shoe. Measuring the real bounds puts every
   * object on screen at the same visual size whatever its aspect.
   */
  let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
  for (const m of obj.marks.concat(obj.regions, obj.tones || []))
    for (const p of m.pts) {
      if (p[0] < bx0) bx0 = p[0]; if (p[0] > bx1) bx1 = p[0];
      if (p[1] < by0) by0 = p[1]; if (p[1] > by1) by1 = p[1];
    }
  const bw = bx1 - bx0, bh = by1 - by0;
  /*
   * An object declares how densely it is drawn. A scene carries many more and
   * much finer elements than a padlock, so one weight and one fit cannot serve
   * both: at the single-object settings the room came out small with a stroke
   * thick enough to swallow its own furniture.
   */
  const O = Objects.ALL[which];
  /*
   * A NIB, not just a weight.
   *
   * The marker defaults — heavy pressure, a double pass, blobs — are the
   * wrong instrument for the pen references: those hold one width along a run
   * and vary only BETWEEN runs. An object that wants a pen says so, and the
   * dials still ride on top of it.
   */
  if (O.nib) P = { ...P, ...O.nib };
  const pen = P.weight * (O.pen || 1);
  const pad = pen * 1.6;
  const box = { w: W * ((O.fit && O.fit.w) || 0.62) * P.scale,
                h: H * ((O.fit && O.fit.h) || 0.40) * P.scale };
  const s = Math.min((box.w - pad) / bw, (box.h - pad) / bh);
  const ox = (W - bw * s) / 2 - bx0 * s;
  const oy = H * 0.55 + P.lift - (bh * s) / 2 - by0 * s;

  const to = (p) => [ox + p[0] * s, oy + p[1] * s];

  document.documentElement.style.setProperty("--paper", P.paper);
  document.documentElement.style.setProperty("--ink", P.ink);
  art.textContent = "";

  const add = (d, fill) => {
    if (!d) return;
    const el = document.createElementNS(NS, "path");
    el.setAttribute("d", d);
    el.setAttribute("fill", fill);
    el.setAttribute("fill-rule", "nonzero");
    art.appendChild(el);
  };

  /* accent first — in the reference it sits UNDER the line work */
  /* A scene needs more than one accent, so a region may carry its own fill;
     a single object still falls back to the one global accent. */
  if (P.on) for (const r of obj.regions)
    add(Hand.region(r.pts.map(to), {
      ...P, curve: r.curve !== false, weight: pen,
      seed: P.seed + (r.s || 0),
    }), shade(r.fill ? P[r.fill] || r.fill : P.colour, r.shade));

  /* Tone sits between the flat accent and the line work: it is shading, so it
     must read under an outline, never over it. */
  for (const t of (obj.tones || []))
    add(Hand.tone(t.pts.map(to), {
      ...P, weight: pen * (t.w || 0.6), curve: t.curve === true,
      seed: P.seed + (t.s || 0),
      hatchAngle: t.angle != null ? t.angle : P.hatchAngle,
      hatchGap: (t.gap || 1) * P.hatchGap,
      toneGap: (t.gap || 1) * P.toneGap,
      scribbleGap: (t.gap || 1) * P.scribbleGap,
    }, t.kind), t.fill ? P[t.fill] || t.fill : P.ink);

  for (const m of obj.marks)
    add(Hand.mark(m.pts.map(to), {
      ...P, closed: !!m.closed, curve: m.curve !== false,
      weight: pen * (m.w || 1),
    }), P.ink);

  if (P.specks > 0)
    add(Hand.specks({ x: ox + bx0 * s - 40, y: oy + by0 * s - 40,
                      w: bw * s + 80, h: bh * s + 80 }, P.specks,
                    { ...P, weight: pen }), P.ink);

  cap.textContent = CAPTIONS[which] || "";
  document.getElementById("meta").textContent =
    `${Objects.ALL[which].label.toUpperCase()} · seed ${P.seed} · ${art.children.length} paths`;
}

/* tabs */
const tabs = document.getElementById("tabs");
Objects.keys.forEach((k) => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.textContent = Objects.ALL[k].label;
  b.setAttribute("aria-pressed", String(k === which));
  b.onclick = () => {
    which = k;
    [...tabs.children].forEach((o, i) => o.setAttribute("aria-pressed", String(Objects.keys[i] === k)));
    draw();
  };
  tabs.appendChild(b);
});

/* createDialKit only REGISTERS a panel with the store — the UI does not exist
   until a root is mounted, and nothing errors if you forget, so the page just
   renders with defaults and no dials. */
if (!q.has("nodial")) DialKit.createDialRoot({ position: "top-right", theme: "dark" });
const kit = DialKit.createDialKit("Doodle", DEFAULTS, { id: "doodle-hand", persist: true });
kit.subscribe((v) => { V = flat(v); draw(); }, true);
</script>
</html>
