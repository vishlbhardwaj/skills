<script>
const { flat, Live } = Stage;
const q = new URLSearchParams(location.search);
const P = flat({
  seed: 7, weight: 26, wander: 0.09, pressure: 0.18, pressureFreq: 2.4,
  wobble: 2.6, boil: 0.11, overshoot: 0.16, breaks: 0.02, blobs: 0, specks: 0,
  doubleOffset: 0.5, double: false, hatchAngle: 52, hatchGap: 9, toneGap: 11,
  toneDot: 0.26, scribbleGap: 12, regionRag: 0.5, offsetX: 0, offsetY: 0,
  paper: "#FFFFFF", ink: "#17171A", cWood: "#D0A062", cWash: "#F2EEE8",
  cLeaf: "#7E9B5E", cLeafD: "#5E7A4A", cOlive: "#9AA886", cCactus: "#88A86E", cTerra: "#C8794C", cPot: "#DCD6CA", cSoil: "#6B5848",
  outline: q.get("outline") === "1", showShadow: true,
});
const TILE = { w: Math.round(1000 * Drawing._aspect), h: 1000, gap: 0 };
const art = document.getElementById("art"), world = document.getElementById("world");
const CELLS = [{ key: "main", mod: Drawing.main }];
let tile = null;
function render() {
  world.textContent = "";
  tile = Stage.build({ key: "main", mod: Drawing.main, col: 0, row: 0 }, P, TILE);
  world.appendChild(tile);
}
render();
art.setAttribute("viewBox", `0 0 ${TILE.w} ${TILE.h}`);
art.setAttribute("preserveAspectRatio", "xMidYMid meet");
const draw = () => Live.play(tile, { solo: false, speed: 2600, minMs: 40, gap: 6 });
addEventListener("keydown", (e) => { if (e.key === "d") draw(); });
VDLTweak.expose({ P, render, palette: [] });
if (q.get("draw") === "1") setTimeout(draw, 200);
</script>
