<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Houses — five types</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #FBFAF8; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!--
  FIVE HOUSES (src/houses.js), a presentation page like buildings.html.
    houses.html                 all five in a row
    houses.html?h=<key>         one house, fitted to the window (VDL frames use this)
    &draw=1                     draw it live, stroke by stroke — the drawing is the loading state
  keys: aframe saltbox bungalow kerala stilt.   d = draw again.
-->
<svg id="art" aria-label="Houses"><g id="world"></g></svg>
<script src="src/hand.js"></script>
<script src="src/view.js"></script>
<script src="src/kit.js"></script>
<script src="src/letter.js"></script>
<script src="src/spec.js"></script>
<script src="src/stage.js"></script>
<script src="src/vdl-tweak.js"></script>
<script src="src/plants.js"></script>
<script src="src/arch.js"></script>
<script src="src/arch2.js"></script>
<script src="src/houses.js"></script>
<script>
const { flat, Live } = Stage;
const q = new URLSearchParams(location.search);
const keys = q.get("h") ? [q.get("h")] : Houses._keys;
/* the house weight and hand of buildings.html, so these sit in the same set */
const P = flat({
  seed: 7, weight: 26, wander: 0.09, pressure: 0.18, pressureFreq: 2.4,
  wobble: 2.6, boil: 0.11, overshoot: 0.16, breaks: 0.02, blobs: 0, specks: 0,
  doubleOffset: 0.5, double: false, hatchAngle: 52, hatchGap: 9, toneGap: 11,
  toneDot: 0.26, scribbleGap: 12, regionRag: 0.5, offsetX: 0, offsetY: 0,
  paper: "#FBFAF8", ink: "#141414", cWood: "#D0A062", cWash: "#E9E4DA",
  outline: false, showShadow: true,
});
const TILE = { w: 940, h: 1000, gap: 26 };
const FIT = { w: 0.94, h: 0.93 };
const art = document.getElementById("art"), world = document.getElementById("world");
let tiles = [];
/* the shape bin/check.js reads: it counts these and audits each module's class */
const CELLS = keys.map((key) => ({ key, mod: Houses[key] }));
/* render() can run again: VDL's Randomise tab rebuilds with new hand/palette values */
function render() {
  world.textContent = "";
  tiles = [];
  keys.forEach((key, i) => {
    const mod = Houses[key];
    if (!mod) throw new Error("no such house: " + key);
    const g = Stage.build({ key, mod: { ...mod, fit: FIT }, col: i, row: 0 }, P, TILE);
    world.appendChild(g);
    tiles.push(g);
  });
}
render();
const W = keys.length * TILE.w + (keys.length - 1) * TILE.gap;
art.setAttribute("viewBox", `0 0 ${W} ${TILE.h}`);
art.setAttribute("preserveAspectRatio", "xMidYMid meet");
const draw = () => tiles.forEach((g, i) => Live.play(g, { solo: false, speed: 2600, minMs: 40, gap: 6 + i * 4 }));
addEventListener("keydown", (e) => { if (e.key === "d") draw(); });
VDLTweak.expose({ P, render, palette: [] });   // houses are line + black: ink and paper are their colour
if (q.get("draw") === "1") setTimeout(draw, 200);
</script>
</html>
