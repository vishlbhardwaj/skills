<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Still life — ten elements</title>
<link rel="stylesheet" href="vendor/dialkit.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #FFFFFF; overflow: hidden;
         font: 12px/1.5 ui-monospace, Menlo, monospace; color: #6B675F; }
  #art { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
         cursor: grab; touch-action: none; }
  #art.drag { cursor: grabbing; }
  .tip { position: fixed; right: 14px; bottom: 14px; opacity: .5; letter-spacing: .04em; }
</style>

<svg id="art" aria-label="Ten still life elements"><g id="world"></g></svg>
<div class="tip">scroll to zoom · drag to pan · f = fit · s = rough in · d = draw one · a = draw all ten</div>

<script src="vendor/dialkit.js"></script>
<script src="src/hand.js"></script>
<script src="src/view.js"></script>
<script src="src/kit.js"></script>
<script src="src/letter.js"></script>
<script src="src/spec.js"></script>
<script src="src/stage.js"></script>
<script src="src/still.js"></script>
<script>
/*
 * TEN STILL LIFE ELEMENTS ON A WHITE SHEET — a specimen plate, two rows of
 * five, in the register of plants.html.
 *
 * The page's job here is more than display: `a` draws all ten in order from a
 * blank sheet, which is the form this set was asked for. That is why the
 * sequence lives on the page and not in the module — what order ten drawings
 * are made in is a property of the SHEET, the same way a storyboard's read
 * order is a property of the board.
 */
const TILE = { w: 900, h: 1000, gap: 40 };
const COLS = 5;
const { NS, flat, Live } = Stage;
const q = new URLSearchParams(location.search);

const DEFAULTS = {
  view: { outline: q.get("outline") === "1", showShadow: true },
  mark: {
    weight:       [Spec.REF, 1, 60, 0.5],
    wander:       [0.045, 0, 2, 0.005],
    wobble:       [4, 2, 24, 1],
    pressure:     [0.22, 0, 1, 0.01],
    pressureFreq: [5, 2, 20, 1],
    boil:         [0.1, 0, 1.2, 0.01],
    overshoot:    [0.12, 0, 4, 0.05],
  },
  pen: {
    double:       false,
    doubleOffset: [0.5, 0, 3, 0.05],
    breaks:       [0.012, 0, 0.9, 0.005],
    blobs:        [0, 0, 2.5, 0.05],
    specks:       [0, 0, 60, 1],
  },
  tone: {
    hatchAngle:  [52, 0, 180, 1],
    hatchGap:    [9, 2, 40, 0.5],
    toneGap:     [11, 3, 40, 0.5],
    toneDot:     [0.24, 0.1, 0.8, 0.01],
    scribbleGap: [14, 4, 50, 0.5],
  },
  plate: {
    offsetX:   [0, -20, 20, 0.5],
    offsetY:   [0, -20, 20, 0.5],
    regionRag: [0.35, 0, 3, 0.05],
  },
  /*
   * EVERY key src/still.js names must be here. An unknown key is not an
   * error in Stage — it falls through to the raw string, which the browser
   * cannot read as a colour and renders BLACK. That is how the board's
   * armchair came out a slab; ten objects would come out ten slabs.
   */
  palette: {
    cStone:  "#C9BFA8",   /* salt-glazed grey stoneware */
    cGlass:  "#AFC4B2",   /* Rhenish green, pale: glass is mostly its outline */
    cWine:   "#8E3A44",
    cPewter: "#B9BCC2",
    cFish:   "#9BA7B0",
    cCrust:  "#B97A3E",
    cBread:  "#E8C58E",
    cLemon:  "#EFC13A",
    cPith:   "#F6EDD4",
    cBone:   "#EAE3CF",
    cGrain:  "#E9DCBA",
    cFrame:  "#B8814C",
    cBrass:  "#C9A043",
    cWax:    "#F1EADA",
    cGrape:  "#6E5A7E",
    cBloom:  "#C9BED2",
    cGreen:  "#5E7A55",
    cBookR:  "#A8453A",
    cBookB:  "#4A6A8E",
    cBookG:  "#6E7A4E",
    cPage:   "#EFE8D6",
    cInk:    "#17171A",
    cWash:   "#F2EEE8",
  },
  sheet: {
    ink:   "#17171A",
    paper: "#FFFFFF",
    seed:  [7, 1, 999, 1],
  },
};

const world = document.getElementById("world");
const art = document.getElementById("art");

const SHEET_W = COLS * TILE.w + (COLS - 1) * TILE.gap;
const ROWS = Math.ceil(Still._keys.length / COLS);
const SHEET_H = ROWS * TILE.h + (ROWS - 1) * TILE.gap;

const CELLS = Still._keys.map((key, i) => ({
  key, mod: { ...Still[key], nib: null }, n: i + 1, name: Still._names[key],
  x: (i % COLS) * (TILE.w + TILE.gap), y: Math.floor(i / COLS) * (TILE.h + TILE.gap),
}));

const caption = (txt, x, y, size) => {
  const t = document.createElementNS(NS, "text");
  t.setAttribute("x", x); t.setAttribute("y", y);
  t.setAttribute("text-anchor", "middle"); t.setAttribute("fill", "#8A867E");
  t.setAttribute("style", `font: ${size}px ui-monospace, Menlo, monospace; letter-spacing: .12em`);
  t.textContent = txt;
  return t;
};

function draw(P) {
  document.body.style.background = P.paper;
  world.textContent = "";
  for (const c of CELLS) {
    let g;
    try { g = Stage.build({ key: c.key, mod: c.mod, col: 0, row: 0 }, P, TILE); }
    catch (e) { console.error("subject '" + c.key + "' failed:", e); continue; }
    g.setAttribute("transform", `translate(${c.x} ${c.y})`);
    g.appendChild(caption(String(c.n).padStart(2, "0") + "  " + c.name.toUpperCase(),
                          TILE.w / 2, TILE.h - 20, 22));
    world.appendChild(g);
  }
}

let k = 1, tx = 0, ty = 0;
const apply = () => world.setAttribute("transform", `translate(${tx} ${ty}) scale(${k})`);

function fitAll() {
  const f = q.get("focus") && CELLS.find((c) => c.key === q.get("focus"));
  const x0 = f ? f.x : 0, y0 = f ? f.y : 0;
  const W = f ? TILE.w : SHEET_W, H = f ? TILE.h : SHEET_H;
  const m = 40, panel = q.has("nodial") ? 0 : 270;
  const vw = innerWidth - panel;
  k = Math.min((vw - m * 2) / W, (innerHeight - m * 2) / H);
  tx = (vw - W * k) / 2 - x0 * k;
  ty = (innerHeight - H * k) / 2 - y0 * k;
  apply();
}

function zoomAt(cx, cy, f) {
  const nk = Math.max(0.05, Math.min(14, k * f));
  tx = cx - (cx - tx) * (nk / k);
  ty = cy - (cy - ty) * (nk / k);
  k = nk; apply();
}
art.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
}, { passive: false });

let dragging = false, lx = 0, ly = 0;
art.addEventListener("pointerdown", (e) => {
  dragging = true; lx = e.clientX; ly = e.clientY; art.classList.add("drag");
  try { art.setPointerCapture(e.pointerId); } catch (err) {}
});
art.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; apply();
});
["pointerup", "pointercancel"].forEach((n) =>
  art.addEventListener(n, () => { dragging = false; art.classList.remove("drag"); }));

const cells = () => [...world.children].filter((el) => el.__strokes);
function atCentre() {
  let best = null, bd = 1e9;
  for (const el of cells()) {
    const b = el.getBoundingClientRect();
    const d = Math.hypot(b.left + b.width / 2 - innerWidth / 2, b.top + b.height / 2 - innerHeight / 2);
    if (d < bd) { bd = d; best = el; }
  }
  return best;
}

/*
 * THE SEQUENCE — ten drawings made one after another on a sheet that starts
 * empty. Every cell is armed first (taken off the paper with no animation)
 * rather than each being blanked as its turn comes: a sheet that empties one
 * tile at a time reads as nine finished drawings being rubbed out, which is
 * the opposite of what is being shown.
 */
let seq = null;
async function drawAll(opt) {
  if (seq) { seq = null; Live.stop(); cells().forEach((el) => Live.reset(el)); return; }
  const list = cells();
  const me = (seq = {});
  list.forEach((el) => Live.arm(el));
  for (const el of list) {
    if (seq !== me) return;
    await new Promise((done) => Live.play(el, { solo: false, ...(opt || {}), done }));
  }
  if (seq === me) seq = null;
}

addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "0") fitAll();
  if (e.key === "a") drawAll({ speed: +(q.get("speed") || 3200) });
  if (e.key === "s") {
    const g = atCentre();
    if (g) Live.sketch(g);
  }
  if (e.key === "d" || e.key === "D") {
    const g = atCentre();
    if (!g) return;
    if (Live.running) { Live.stop(); Live.reset(g); return; }
    Live.play(g, e.key === "D" ? { speed: 900, gap: 70, fillMs: 300 } : {});
  }
});
addEventListener("resize", fitAll);

if (q.has("reset")) { try { for (const key of Object.keys(localStorage)) if (/still/i.test(key)) localStorage.removeItem(key); } catch (e) {} }

/* ?sketch=1 adds the pencil underdrawing; ?draw=all runs the sequence on load */
function started() {
  fitAll();
  if (q.get("draw") === "all") setTimeout(() => drawAll({ speed: +(q.get("speed") || 3200) }), 300);
}
if (q.has("nodial")) {
  const P = flat(DEFAULTS); P.ghost = q.get("sketch") === "1";
  draw(P); started();
} else {
  DialKit.createDialRoot({ position: "top-right", theme: "dark" });
  const panel = DialKit.createDialKit("Still life", DEFAULTS, { id: "doodle-still", persist: true });
  let first = true;
  panel.subscribe((v) => {
    const P = flat(v); P.ghost = q.get("sketch") === "1";
    draw(P);
    if (first) { first = false; started(); }
  }, true);
}
</script>
</html>
