<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buildings — an infinite doodle canvas</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #FBFAF8; color: #4A463F; overflow: hidden;
         font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  svg { display: block; width: 100vw; height: 100vh; cursor: grab; }
  svg.drag { cursor: grabbing; }
</style>
</head>
<body>
<svg id="art" aria-label="Buildings on an infinite canvas"><g id="world"></g></svg>

<script src="src/hand.js"></script>
<script src="src/view.js"></script>
<script src="src/kit.js"></script>
<script src="src/letter.js"></script>
<script src="src/spec.js"></script>
<script src="src/stage.js"></script>
<script src="src/plants.js"></script>
<script src="src/arch.js"></script>
<script src="src/arch2.js"></script>
<script>
/*
 * AN INFINITE-CANVAS READ OF THE WHOLE SET.
 *
 * All twenty-one buildings are on the sheet from the start. You arrive close
 * in on the middle TWO, and watch those being drawn. Zoom out and the view
 * SNAPS to the next ring: the neighbours are already finished, and they come
 * up with a scale and a fade, staggered outward, so widening the view feels
 * like discovering work that was already there rather than loading it.
 *
 * Three ideas hold it together:
 *
 *   RINGS, not free zoom. `ring()` is a Chebyshev distance from the centre
 *   PAIR, so level 0 is two buildings, then 12, 18, 21. Each level has one
 *   framing, and the wheel steps between them.
 *
 *   EVERY TILE IS BUILT ONCE, up front. Revealing is opacity and scale on
 *   something that already exists — never a render. Drawing twenty-one
 *   buildings mid-gesture would stutter, and the whole point is that the
 *   neighbours were already there.
 *
 *   SCALE ABOUT THE TILE'S OWN CENTRE. Each subject sits in a wrapper that
 *   carries its grid position, so the inner transform is free to do the
 *   reveal. Scaling a group that also carries its translate sends the tile
 *   flying toward the origin.
 */

/*
 * 5 × 3 = 15, THE CAFE IN THE MIDDLE.
 *
 * Twenty-one needed two zoom-outs to show, and the second step was more
 * arriving-at-once than anyone can read. Fifteen fits a screen at one remove:
 * the centre cell plus everything around it, revealed in a SINGLE move.
 *
 * Chosen for silhouette spread rather than completeness — tiered, round,
 * gabled, half-timbered, columned, crenellated, latticed, modern.
 */
const GRID = [
  ["pagoda",     "windmill", "chalet",   "townhouse", "deco"],
  ["temple",     "mansion",  "cafe",     "chapel",    "lighthouse"],
  ["watertower", "riad",     "townhall", "villa",     "shophouse"],
];
const COLS = GRID[0].length, ROWS = GRID.length;
/*
 * The focus is stated outright rather than derived.
 *
 * Deriving the centre as (COLS-1)/2 gives a single column on an odd grid, and
 * trying to widen it to a pair with a half-unit fudge produced fractional
 * rings — 0, 0.5, 1, 1.5, 2.5 — so "one level" meant half a ring and the
 * centre held one building instead of two. Distance is measured from the
 * focus BLOCK: zero inside it, and how far outside it otherwise.
 */
const FOCUS_COLS = [2, 2], FOCUS_ROW = 1;   // one cell: the cafe
const CX = (FOCUS_COLS[0] + FOCUS_COLS[1]) / 2, CY = FOCUS_ROW;

/*
 * SPREAD IS `fit` AND `gap`, NOT TILE SIZE.
 *
 * Shrinking the tile changes nothing: the drawing is fitted TO the tile, so
 * the whitespace shrinks with it and the picture is identical, just at a
 * different zoom. What actually closes the distance is filling more of each
 * tile and cutting the gutter.
 */
const TILE = { w: 940, h: 1000, gap: 26 };
const FIT = { w: 0.97, h: 0.95 };   // modules ship 0.86 × 0.84
const { flat, Live } = Stage;

const ALL = Object.assign({}, ...Arch._keys.map((k) => ({ [k]: Arch[k] })),
                              ...Arch2._keys.map((k) => ({ [k]: Arch2[k] })));

/*
 * Two states, not a gradient of rings: the cafe, then everything. One zoom-out
 * shows the whole set, which is the point of keeping it to fifteen.
 */
const ring = (col, row) =>
  (col >= FOCUS_COLS[0] && col <= FOCUS_COLS[1] && row === FOCUS_ROW) ? 0 : 1;

const CELLS = [];
GRID.forEach((line, row) => line.forEach((key, col) => {
  if (!key) return;
  if (!ALL[key]) throw new Error("no such building: " + key);
  CELLS.push({ key, mod: ALL[key], col, row, ring: ring(col, row) });
}));
const MAXLEVEL = Math.max(...CELLS.map((c) => c.ring));
const FOCUS = CELLS.filter((c) => c.ring === 0);

const P = flat({
  seed: 7, weight: 26, wander: 0.09, pressure: 0.18, pressureFreq: 2.4,
  wobble: 2.6, boil: 0.11, overshoot: 0.16, breaks: 0.02, blobs: 0, specks: 0,
  doubleOffset: 0.5, double: false, hatchAngle: 52, hatchGap: 9, toneGap: 11,
  toneDot: 0.26, scribbleGap: 12, regionRag: 0.5, offsetX: 0, offsetY: 0,
  paper: "#FBFAF8", ink: "#141414", cWood: "#D0A062", cWash: "#E9E4DA",
  outline: false, showShadow: true,
});

/*
 * One step should read as a single unhurried move. The reveal wave is timed
 * to LAND WITH the camera: last tile starts at STAGGER_IN + (n-1)·STAGGER and
 * runs for REVEAL_MS, which for the biggest ring comes out just under
 * CAMERA_MS. Finish the camera first and the neighbours visibly catch up
 * afterwards, which is the two-phase feeling again in miniature.
 */
const CAMERA_MS = 1250, REVEAL_MS = 780, STAGGER_IN = 70, STAGGER = 32;
/*
 * How small a neighbour starts. At 0.9 the growth was 10% — swamped by the
 * camera pulling back at the same time, so the tiles read as simply fading
 * on. A tile has to arrive from far enough away to be seen travelling.
 */
const SCALE_FROM = 0.42;

const NS = Stage.NS;
const world = document.getElementById("world");
const art = document.getElementById("art");
/* ── build every tile once ──────────────────────────────────────────── */
for (const c of CELLS) {
  const wrap = document.createElementNS(NS, "g");
  wrap.setAttribute("transform",
    `translate(${c.col * (TILE.w + TILE.gap)} ${c.row * (TILE.h + TILE.gap)})`);
  /* col/row are zero here on purpose: the WRAPPER carries the position, so
     the inner group's transform is free for the reveal */
  let g;
  try {
    g = Stage.build({ key: c.key, mod: { ...c.mod, fit: FIT }, col: 0, row: 0 }, P, TILE);
  }
  catch (e) { console.error("building '" + c.key + "' failed:", e); continue; }
  wrap.appendChild(g);
  world.appendChild(wrap);
  c.wrap = wrap; c.g = g;
  c.shown = c.ring === 0;
  wrap.style.opacity = c.shown ? 1 : 0;
  if (!c.shown) {
    /*
     * `visibility: hidden`, not just opacity 0.
     *
     * A transparent element is still rasterised. At level 0 that is fourteen
     * finished buildings — a couple of thousand paths — being painted every
     * frame behind a drawing that is trying to animate. Visibility takes them
     * out of the paint entirely, and level 0 is exactly where smoothness
     * matters because that is where the live drawing runs.
     */
    wrap.style.visibility = "hidden";
    wrap.style.pointerEvents = "none";
  }
}

/* ── view ───────────────────────────────────────────────────────────── */
let k = 1, tx = 0, ty = 0, level = 0;
const apply = () =>
  world.setAttribute("transform", `translate(${tx} ${ty}) scale(${k})`);

/* in-out for the camera (it starts and ends at rest); out for a tile
   arriving (it comes in carrying speed and settles) */
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const linear = (t) => t;
/* overshoots ~6% and settles — a tile ARRIVING, not a tile being resized */
const backOut = (t) => {
  const c = 0.95, d = c + 1;
  return 1 + d * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
};

function tween(ms, step, fn) {
  const E = fn || easeInOut;
  return new Promise((res) => {
    const t0 = performance.now();
    const tick = (t) => {
      const u = Math.min(1, (t - t0) / ms);
      step(E(u));
      if (u < 1) requestAnimationFrame(tick); else res();
    };
    requestAnimationFrame(tick);
  });
}

/* the framing that holds every tile up to `lv` */
function frameFor(lv) {
  const vis = CELLS.filter((c) => c.ring <= lv);
  const c0 = Math.min(...vis.map((c) => c.col)), c1 = Math.max(...vis.map((c) => c.col));
  const r0 = Math.min(...vis.map((c) => c.row)), r1 = Math.max(...vis.map((c) => c.row));
  const x = c0 * (TILE.w + TILE.gap), y = r0 * (TILE.h + TILE.gap);
  const w = (c1 - c0 + 1) * TILE.w + (c1 - c0) * TILE.gap;
  const h = (r1 - r0 + 1) * TILE.h + (r1 - r0) * TILE.gap;
  const m = lv === 0 ? 70 : 52;
  const nk = Math.min((innerWidth - m * 2) / w, (innerHeight - m * 2) / h);
  return { k: nk, tx: (innerWidth - w * nk) / 2 - x * nk,
           ty: (innerHeight - h * nk) / 2 - y * nk };
}

/*
 * Reveal a tile: it scales up about ITS OWN CENTRE and fades in. The stagger
 * runs outward from the middle, so a ring arrives as a wave rather than all
 * at once — which is the difference between "appearing" and "being there
 * already, found".
 */
function revealTile(c, delay, showing, animate) {
  const cx = TILE.w / 2, cy = TILE.h / 2;
  const set = (s, o) => {
    c.g.setAttribute("transform",
      `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`);
    c.wrap.style.opacity = o;
  };
  /*
   * A non-animated step must be instant for the TILES too, not just the
   * camera. Loading straight to ?level=1 jumped the view but still ran the
   * reveal tweens, so the page arrived mid-fade — and in any context without
   * a frame loop it arrived blank.
   */
  if (!animate) {
    c.g.removeAttribute("transform");
    c.wrap.style.opacity = showing ? 1 : 0;
    c.wrap.style.visibility = showing ? "" : "hidden";
    c.wrap.style.pointerEvents = showing ? "" : "none";
    return;
  }
  setTimeout(() => {
    /* it has to be paintable before it can fade in, and `will-change` is only
       honest while something is actually changing */
    c.wrap.style.visibility = "";
    c.wrap.style.willChange = "opacity";
    /*
     * Scale and opacity run on DIFFERENT curves off the same clock: the fade
     * settles early (easeOut) so the tile is legible while it is still
     * moving, and the scale overshoots slightly (backOut) so it lands rather
     * than creeps. One curve for both makes the motion read as a dissolve.
     */
    tween(showing ? REVEAL_MS : REVEAL_MS * 0.6, (u) => {
      if (showing) set(SCALE_FROM + (1 - SCALE_FROM) * backOut(u), easeOut(u));
      else {
        const e = easeInOut(u);
        set(1 - (1 - SCALE_FROM) * e, 1 - e);
      }
    }, linear).then(() => {
      if (showing) c.g.removeAttribute("transform");
      else c.wrap.style.visibility = "hidden";
      c.wrap.style.willChange = "";
      c.wrap.style.pointerEvents = showing ? "" : "none";
    });
  }, delay);
}

function goTo(lv, animate) {
  lv = Math.max(0, Math.min(MAXLEVEL, lv));
  const was = level;
  level = lv;
  const target = frameFor(lv);

  /* tiles whose visibility changes at this step */
  const changed = CELLS.filter((c) => (c.ring <= lv) !== c.shown);
  const widening = lv > was;
  changed.sort((a, b) => (widening ? a.ring - b.ring : b.ring - a.ring)
    || Math.abs(a.col - CX) - Math.abs(b.col - CX));
  let revealEnd = 0;
  changed.forEach((c, i) => {
    c.shown = c.ring <= lv;
    const delay = widening ? STAGGER_IN + i * STAGGER : i * 18;
    revealEnd = Math.max(revealEnd, delay + (c.shown ? REVEAL_MS : REVEAL_MS * 0.55));
    revealTile(c, delay, c.shown, animate);
  });

  if (!animate) { k = target.k; tx = target.tx; ty = target.ty; return apply(); }

  /*
   * ZOOM IS GEOMETRIC, NOT LINEAR.
   *
   * Lerping k from 1.00 to 0.33 spends the first half of the tween covering
   * most of the perceived distance and the second half barely moving — zoom
   * is felt as a RATIO, so equal steps have to be equal multiples. Interpolate
   * k geometrically and carry the world-space point under the screen centre
   * linearly; the view then pulls back at a steady rate and settles.
   */
  const k0 = k, k1 = target.k;
  const c0 = [(innerWidth / 2 - tx) / k0, (innerHeight / 2 - ty) / k0];
  const c1 = [(innerWidth / 2 - target.tx) / k1, (innerHeight / 2 - target.ty) / k1];
  const ratio = k1 / k0;
  const camera = tween(CAMERA_MS, (u) => {
    k = k0 * Math.pow(ratio, u);
    const cx = c0[0] + (c1[0] - c0[0]) * u, cy = c0[1] + (c1[1] - c0[1]) * u;
    tx = innerWidth / 2 - cx * k;
    ty = innerHeight / 2 - cy * k;
    apply();
  });
  /*
   * The step is not over until the last tile has SETTLED.
   *
   * `revealEnd` is when the last tween is scheduled to reach u = 1, but its
   * cleanup — dropping the transform and clearing `will-change` — runs on the
   * frame after that. Resolving on the bare figure left exactly one tile
   * mid-cleanup, so a fast second pinch could land inside the tail of the
   * wave. A couple of frames of margin closes it.
   */
  return Promise.all([camera, new Promise((r) => setTimeout(r, revealEnd + 120))]);
}

/* ── pinch to zoom, scroll to pan ───────────────────────────────────── */
let accum = 0, consumed = false, idleTimer = null, busy = false;

/*
 * PINCH ZOOMS; SCROLL PANS.
 *
 * On a trackpad a pinch arrives as a `wheel` event with `ctrlKey` set — the
 * browser synthesises it, and it is the only thing that distinguishes a pinch
 * from a two-finger scroll. Treating every wheel event as zoom meant you
 * could not scroll past the canvas without changing level.
 *
 * ONE GESTURE, ONE LEVEL. A flag cleared when the animation finished was not
 * enough: a trackpad keeps emitting events for about a second after the
 * fingers lift, so the momentum tail arrived after the cooldown and stepped
 * again — one long pinch travelled two levels in two visible phases. A
 * gesture is defined by its SILENCE (events closer than 170ms are one
 * gesture), and once one has moved a level the rest of it is swallowed.
 */
art.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (!e.ctrlKey) {                       /* two-finger scroll: pan */
    tx -= e.deltaX; ty -= e.deltaY; apply();
    return;
  }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { consumed = false; accum = 0; }, 170);
  if (consumed || busy) return;
  accum += e.deltaY;
  if (Math.abs(accum) < 14) return;       /* pinch deltas are small */
  pinch(accum > 0 ? 1 : -1);
}, { passive: false });

function pinch(dir) {
  accum = 0;
  if ((dir > 0 && level >= MAXLEVEL) || (dir < 0 && level <= 0)) return;
  consumed = true;
  step(dir);
}

/* two-finger pinch on a touchscreen */
let pinchStart = 0, pinchDone = false;
const spread = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
art.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) { pinchStart = spread(e.touches); pinchDone = false; }
}, { passive: true });
art.addEventListener("touchmove", (e) => {
  if (e.touches.length !== 2 || !pinchStart || pinchDone || busy) return;
  e.preventDefault();
  const r = spread(e.touches) / pinchStart;
  if (r < 0.78) { pinchDone = true; consumed = true; step(1); }
  else if (r > 1.28) { pinchDone = true; consumed = true; step(-1); }
}, { passive: false });
art.addEventListener("touchend", (e) => {
  if (e.touches.length < 2) { pinchStart = 0; consumed = false; }
}, { passive: true });

function step(dir) {
  if (busy) return;
  busy = true;
  goTo(level + dir, true).then(() => { busy = false; });
}

let drag = null;
art.addEventListener("pointerdown", (e) => {
  if (pinchStart) return;
  drag = { x: e.clientX - tx, y: e.clientY - ty };
  art.setPointerCapture(e.pointerId); art.classList.add("drag");
});
art.addEventListener("pointermove", (e) => {
  if (!drag) return;
  tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply();
});
["pointerup", "pointercancel"].forEach((n) =>
  art.addEventListener(n, () => { drag = null; art.classList.remove("drag"); }));

/* ── drawing the centre pair ────────────────────────────────────────── */
function drawFocus() {
  if (Live.running) { Live.stop(); FOCUS.forEach((c) => Live.reset(c.g)); return; }
  /* solo:false lets runs overlap, in case the focus is ever more than one */
  FOCUS.forEach((c, i) => Live.play(c.g, { solo: false, speed: 2300 + i * 280,
                                           gap: 8 + i * 6 }));
}

/*
 * No chrome: the canvas is the whole surface. Pinch steps between the cafe
 * and the set, scroll or drag pans, and the keys below cover everything the
 * buttons did.
 */
addEventListener("keydown", (e) => {
  if (e.key === "d") drawFocus();
  if (e.key === "-" || e.key === "_") step(1);
  if (e.key === "=" || e.key === "+") step(-1);
  if (e.key === "0") goTo(MAXLEVEL, true);
  if (e.key === "1") goTo(0, true);
});
addEventListener("resize", () => goTo(level, false));

const q = new URLSearchParams(location.search);
goTo(+(q.get("level") || 0), false);
if (q.get("auto") !== "0") setTimeout(drawFocus, 340);
</script>
</html>
