<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storyboard</title>
<link rel="stylesheet" href="vendor/dialkit.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #FFFFFF; overflow: hidden;
         font: 12px/1.5 ui-monospace, Menlo, monospace; color: #6B675F; }
  #art { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
         cursor: grab; touch-action: none; }
  #art.drag { cursor: grabbing; }
  .tip { position: fixed; right: 14px; bottom: 14px; opacity: .5; letter-spacing: .04em; }
</style>

<svg id="art" aria-label="Storyboard"><g id="world"></g></svg>
<div class="tip">scroll to zoom · drag to pan · f = fit · d = draw the centre panel live</div>

<script src="vendor/dialkit.js"></script>
<script src="src/hand.js"></script>
<script src="src/view.js"></script>
<script src="src/kit.js"></script>
<script src="src/letter.js"></script>
<script src="src/spec.js"></script>
<script src="src/stage.js"></script>
<script src="src/arch.js"></script>
<script src="src/arch2.js"></script>
<script src="src/plants2.js"></script>
<script src="src/furniture2.js"></script>
<script src="src/retro.js"></script>
<script src="src/cafe.js"></script>
<script src="src/board.js"></script>
<script>
/*
 * A STORYBOARD — six panels, one sequence, nothing redrawn.
 *
 * Every subject in here already existed: the café street, the corner café
 * elevation, an armchair, a peace lily, a transistor radio, a sunflower.
 * What makes it a board rather than a contact sheet is that each panel CROPS
 * at a stated shot size and stages its subject off centre, and that the
 * panel's class owns the hand so all six draw at one weight.
 *
 * MORNING AT THE CAFÉ — 6 panels, 16:9.
 */
const q = new URLSearchParams(location.search);

const PANELS = Board.sequence([
  { aspect: "wide", shot: "EWS", secs: 4, move: "pan-r",
    caption: "The street, before anyone is up",
    draw: (k) => {
      k.wash(0, 0.62, "#EAF0F4");
      /* a diorama's bbox is mostly ground, so a true EWS fraction of its
         own height leaves a token. Quote the size against what has to read. */
      k.shot(Cafe.cafe, { size: 0.70, at: [0.46, 0.60] });
    } },

  { aspect: "wide", shot: "WS", secs: 3,
    caption: "The corner cafe. A light goes on",
    draw: (k) => {
      k.wash(0, 0.70, "#EAF0F4");
      k.wash(0.70, 1, "#E6E2D8");
      k.shot(Arch.cafe, { size: "ws", at: [0.34, 0.72], anchor: "feet" });
      k.shot(Arch2.brownstone, { size: 0.34, at: [0.76, 0.72], anchor: "feet" });
      k.ground(0.72, k.DET);
    } },

  { aspect: "wide", shot: "MS", secs: 2, move: "push",
    caption: "Push in on the door",
    draw: (k) => {
      k.wash(0, 1, "#EFEBE2");
      k.shot(Arch.cafe, { size: "ms", at: [0.5, 0.56] });
    } },

  { aspect: "wide", shot: "WS", secs: 5,
    caption: "Inside. Nobody yet",
    dialogue: "Two minutes.",
    draw: (k) => {
      k.wash(0, 0.74, "#F2EDE3");
      k.wash(0.74, 1, "#E0D6C6");
      k.shot(Plants2.peacelily, { size: 0.60, at: [0.80, 0.74], anchor: "feet" });
      k.shot(Furniture2.armchair, { size: 0.44, at: [0.33, 0.78], anchor: "feet" });
      k.ground(0.74, k.TEX);
    } },

  { aspect: "wide", shot: "CU", secs: 2,
    caption: "The radio, already on",
    draw: (k) => {
      k.wash(0, 1, "#EFEBE2");
      k.shot(Retro.radio, { size: "cu", at: [0.42, 0.52] });
    } },

  { aspect: "wide", shot: "WS", secs: 4, move: "tilt-u",
    caption: "Tilt up to the window. Open",
    draw: (k) => {
      k.wash(0, 1, "#F2EDE3");
      k.shot(Plants2.sunflower, { size: 0.82, at: [0.64, 0.84], anchor: "feet" });
    } },
]);

/* ── the sheet ──────────────────────────────────────────────────────── */
const COLS = 3, GAP = 70, CARD_W = 1180;
const TILE = { w: CARD_W, h: Math.round(CARD_W / PANELS.aspect), gap: GAP };

const CELLS = PANELS.map((mod, i) => ({
  key: "panel-" + (i + 1), mod, tile: TILE,
  x: (i % COLS) * (TILE.w + GAP),
  y: Math.floor(i / COLS) * (TILE.h + GAP),
}));

const { NS, flat, Live } = Stage;

/* The dials start at the panel class, not at a number this page picked. */
const C = Spec.CLASS.panel;
const DEFAULTS = {
  view: { outline: q.get("outline") === "1", showShadow: true },
  mark: {
    weight:       [Spec.REF, 1, 60, 0.5],
    wander:       [C.nib.wander, 0, 2, 0.005],
    wobble:       [4, 2, 24, 1],
    pressure:     [C.nib.pressure, 0, 1, 0.01],
    pressureFreq: [5, 2, 20, 1],
    boil:         [C.nib.boil, 0, 1.2, 0.01],
    overshoot:    [C.nib.overshoot, 0, 4, 0.05],
  },
  pen: {
    double: false, doubleOffset: [0.5, 0, 3, 0.05],
    breaks: [C.nib.breaks, 0, 0.9, 0.005],
    blobs: [0, 0, 2.5, 0.05], specks: [0, 0, 60, 1],
  },
  tone: {
    hatchAngle: [52, 0, 180, 1], hatchGap: [11, 2, 40, 0.5],
    toneGap: [13, 3, 40, 0.5], toneDot: [0.24, 0.1, 0.8, 0.01],
    scribbleGap: [16, 4, 50, 0.5],
  },
  plate: { offsetX: [0, -20, 20, 0.5], offsetY: [0, -20, 20, 0.5], regionRag: [0.35, 0, 3, 0.05] },
  palette: {
    cWood: "#D0A062", cPot: "#DCD6CA", cLeaf: "#7E9B5E", cLeafD: "#5E7A4A",
    cOlive: "#A8B35E", cCactus: "#88A86E", cTerra: "#C8794C", cSoil: "#6B5848",
    cFar: "#CFD3CA", cMid: "#B4BCAE", cNear: "#97A48F", cField: "#A8B894",
    cWheat: "#DDC98C", cSand: "#E4D3AE", cSea: "#A9C4C9", cPath: "#D6C6A6",
    cPine: "#6E8A5E", cPineD: "#4E6A44", cBale: "#D4BC7E", cAzure: "#0D6FBE",
    cYellow: "#F0C800", cRed: "#E8504A", cSky: "#96B4D2", cPaper: "#FAFAF8",
    cInk: "#262B2E", cFelt: "#B9B7AE", cScreen: "#D2DEDA", cBeige: "#E6E0D2",
    cWash: "#F2EBE1", cGreen: "#5E7A55", cGreenD: "#44583E", cSofa: "#F1EBE2",
    cOrange: "#E8622A", cAmber: "#F0A526", cBlue: "#7FA3B5", cBrick: "#C08A6A",
    cRoad: "#BFBCB4",
  },
  sheet: { ink: "#17171A", paper: "#FFFFFF", seed: [7, 1, 999, 1] },
};

const world = document.getElementById("world");
const art = document.getElementById("art");

function draw(P) {
  document.body.style.background = P.paper;
  world.textContent = "";
  for (const c of CELLS) {
    let g;
    try { g = Stage.build({ key: c.key, mod: c.mod, col: 0, row: 0 }, P, c.tile); }
    catch (e) { console.error("panel '" + c.key + "' failed:", e); continue; }
    g.setAttribute("transform", `translate(${c.x} ${c.y})`);
    world.appendChild(g);
  }
}

const SHEET_W = COLS * TILE.w + (COLS - 1) * GAP;
const SHEET_H = Math.ceil(CELLS.length / COLS) * (TILE.h + GAP) - GAP;

let k = 1, tx = 0, ty = 0;
const apply = () => world.setAttribute("transform", `translate(${tx} ${ty}) scale(${k})`);

function fitAll() {
  const f = q.get("focus") && CELLS.find((c) => c.key === q.get("focus"));
  const x0 = f ? f.x : 0, y0 = f ? f.y : 0;
  const W = f ? f.tile.w : SHEET_W, H = f ? f.tile.h : SHEET_H;
  const m = 40, panel = q.has("nodial") ? 0 : 270;
  const vw = innerWidth - panel;
  k = Math.min((vw - m * 2) / W, (innerHeight - m * 2) / H);
  tx = (vw - W * k) / 2 - x0 * k;
  ty = (innerHeight - H * k) / 2 - y0 * k;
  apply();
}

function zoomAt(cx, cy, f) {
  const nk = Math.max(0.05, Math.min(14, k * f));
  tx = cx - (cx - tx) * (nk / k); ty = cy - (cy - ty) * (nk / k);
  k = nk; apply();
}
art.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
}, { passive: false });

let dragging = false, lx = 0, ly = 0;
art.addEventListener("pointerdown", (e) => {
  dragging = true; lx = e.clientX; ly = e.clientY; art.classList.add("drag");
  try { art.setPointerCapture(e.pointerId); } catch (err) {}
});
art.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; apply();
});
["pointerup", "pointercancel"].forEach((n) =>
  art.addEventListener(n, () => { dragging = false; art.classList.remove("drag"); }));

function atCentre() {
  let best = null, bd = 1e9;
  for (const el of world.children) {
    if (!el.__strokes) continue;
    const b = el.getBoundingClientRect();
    const d = Math.hypot(b.left + b.width / 2 - innerWidth / 2, b.top + b.height / 2 - innerHeight / 2);
    if (d < bd) { bd = d; best = el; }
  }
  return best;
}
addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "0") fitAll();
  if (e.key === "d" || e.key === "D") {
    const g = atCentre();
    if (!g) return;
    if (Live.running) { Live.stop(); Live.reset(g); return; }
    Live.play(g, e.key === "D" ? { speed: 900, gap: 70, fillMs: 300 } : {});
  }
  /* b — draw the whole board in READ ORDER, one panel after the next.
     Not all at once: a board is a sequence, and watching six panels appear
     simultaneously tells you nothing about the cut. */
  if (e.key === "b") boardRun();
});
let boardSeq = 0;
async function boardRun() {
  const mine = ++boardSeq;
  const gs = [...world.children].filter((el) => el.__strokes);
  Live.stop();
  gs.forEach((g) => Live.reset(g));
  for (const g of gs) {
    if (mine !== boardSeq) return;
    await Live.play(g, { solo: false, speed: 2600, gap: 26, minMs: 55 });
  }
}

addEventListener("resize", fitAll);

if (q.has("reset")) { try { for (const key of Object.keys(localStorage)) if (/board/i.test(key)) localStorage.removeItem(key); } catch (e) {} }
if (q.has("nodial")) { draw(flat(DEFAULTS)); fitAll(); }
else {
  DialKit.createDialRoot({ position: "top-right", theme: "dark" });
  const dp = DialKit.createDialKit("Board", DEFAULTS, { id: "doodle-board", persist: true });
  let first = true;
  dp.subscribe((v) => { draw(flat(v)); if (first) { first = false; fitAll(); } }, true);
}
</script>
</html>
