<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicles</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #FFFFFF; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!--
  VEHICLES (src/vehicles.js), the houses.html shape.
    vehicles.html               all in a row
    vehicles.html?v=<key>       one vehicle, fitted to the window (VDL frames use this)
    &draw=1                     draw it live
  keys: scooter rickshaw camper bus tractor.   d = draw again.
-->
<svg id="art" aria-label="Vehicles"><g id="world"></g></svg>
<script src="src/hand.js"></script>
<script src="src/view.js"></script>
<script src="src/kit.js"></script>
<script src="src/letter.js"></script>
<script src="src/spec.js"></script>
<script src="src/stage.js"></script>
<script src="src/vdl-tweak.js"></script>
<script src="src/retro.js"></script>
<script src="src/vehicles.js"></script>
<script>
const { flat, Live } = Stage;
const q = new URLSearchParams(location.search);
const keys = q.get("v") ? [q.get("v")] : Vehicles._keys;
/* the house weight and hand of buildings.html, so these sit in the same set */
const P = flat({
  seed: 7, weight: 26, wander: 0.09, pressure: 0.18, pressureFreq: 2.4,
  wobble: 2.6, boil: 0.11, overshoot: 0.16, breaks: 0.02, blobs: 0, specks: 0,
  doubleOffset: 0.5, double: false, hatchAngle: 52, hatchGap: 9, toneGap: 11,
  toneDot: 0.26, scribbleGap: 12, regionRag: 0.5, offsetX: 0, offsetY: 0,
  paper: "#FFFFFF", ink: "#17171A", cWood: "#D0A062", cWash: "#F2EEE8",
  /* the plants palette (plants.html) — a page needs every key its subjects use */
  cLeaf: "#7E9B5E", cLeafD: "#5E7A4A", cOlive: "#9AA886", cCactus: "#88A86E", cTerra: "#C8794C", cPot: "#DCD6CA", cSoil: "#6B5848",
  outline: false, showShadow: true,
});
const TILE = { w: 940, h: 1000, gap: 26 };
const FIT = { w: 0.94, h: 0.93 };
const art = document.getElementById("art"), world = document.getElementById("world");
let tiles = [];
/* the shape bin/check.js reads: it counts these and audits each module's class */
const CELLS = keys.map((key) => ({ key, mod: Vehicles[key] }));
/* render() can run again: VDL's Randomise tab rebuilds with new hand/palette values */
function render() {
  world.textContent = "";
  tiles = [];
  keys.forEach((key, i) => {
    const mod = Vehicles[key];
    if (!mod) throw new Error("no such vehicle: " + key);
    const g = Stage.build({ key, mod: { ...mod, fit: FIT }, col: i, row: 0 }, P, TILE);
    world.appendChild(g);
    tiles.push(g);
  });
}
render();
const W = keys.length * TILE.w + (keys.length - 1) * TILE.gap;
art.setAttribute("viewBox", `0 0 ${W} ${TILE.h}`);
art.setAttribute("preserveAspectRatio", "xMidYMid meet");
const draw = () => tiles.forEach((g, i) => Live.play(g, { solo: false, speed: 2600, minMs: 40, gap: 6 + i * 4 }));
addEventListener("keydown", (e) => { if (e.key === "d") draw(); });
VDLTweak.expose({ P, render, palette: [] });   // this set fills with literal hexes: ink + paper are its page colours
if (q.get("draw") === "1") setTimeout(draw, 200);
</script>
</html>
